<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Blue Archive Web Games</title>
<link rel="icon" href="favicon.ico"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;
}
h1{font-size:2.5em;margin-bottom:40px;text-shadow:0 2px 10px rgba(0,0,0,.5);letter-spacing:2px}
.games{display:flex;gap:40px;flex-wrap:wrap;justify-content:center}
.game-card{
  display:block;text-decoration:none;color:#fff;
  width:320px;border-radius:16px;overflow:hidden;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  transition:transform .3s,box-shadow .3s;
}
.game-card:hover{transform:translateY(-8px);box-shadow:0 20px 40px rgba(0,0,0,.4)}
.game-thumb{width:100%;height:200px;display:flex;align-items:center;justify-content:center;font-size:3em}
.game-thumb-rail{background:linear-gradient(135deg,#e94560,#533483)}
.game-thumb-rhythm{background:linear-gradient(135deg,#00d2ff,#3a47d5)}
.game-thumb-anniv{background:linear-gradient(135deg,#f9d423,#ff4e50)}
.game-thumb-midautumn{background:linear-gradient(135deg,#6a3093,#a044ff)}
.game-info{padding:20px}
.game-info h2{font-size:1.4em;margin-bottom:8px}
.game-info p{font-size:.95em;opacity:.7;line-height:1.5}
.footer{margin-top:50px;opacity:.4;font-size:.85em}
</style>
</head>
<body>
<h1>Blue Archive Web Games</h1>
<div class="games">
  <a class="game-card" href="./RailOps2026/">
    <div class="game-thumb game-thumb-rail">🚂</div>
    <div class="game-info">
      <h2>RailOps2026</h2>
      <p>全速前进！铁轨巡游大作战</p>
    </div>
  </a>
  <a class="game-card" href="./RhythmGame2026/">
    <div class="game-thumb game-thumb-rhythm">🎵</div>
    <div class="game-info">
      <h2>RhythmGame2026</h2>
      <p>炫音节拍</p>
    </div>
  </a>
  <a class="game-card" href="./Anniversary2025/">
    <div class="game-thumb game-thumb-anniv">🎉</div>
    <div class="game-info">
      <h2>Anniversary2025</h2>
      <p>宴会上也要维护风纪！~日奈的热身运动~</p>
    </div>
  </a>
  <a class="game-card" href="./MidAutumn2026/">
    <div class="game-thumb game-thumb-midautumn">🌕</div>
    <div class="game-info">
      <h2>MidAutumn2026</h2>
      <p>月饼复制危机！泡泡月饼大作战</p>
    </div>
  </a>
</div>
<div class="footer">Blue Archive Web Games Collection</div>
</body>
</html>
