<script>
window._findRhythmGC=function(){if(window._gc&&!window._gc.isGameOver)return window._gc;try{if(typeof cc==="undefined"||!cc.director)return null;var s=cc.director.getScene();if(!s)return null;function walk(n,d){d=d||0;if(d>9)return null;var cs=n._components||n.components||[];for(var j=0;j<cs.length;j++){if(cs[j]&&typeof cs[j].pauseGame==="function"&&typeof cs[j].resumeGame==="function"){return cs[j];}}for(var i=0;i<n.children.length;i++){var r=walk(n.children[i],d+1);if(r)return r;}return null;}return walk(s,0);}catch(e){return null;}};
window._escHandlerRhythm=function(n){if(n.key!=="Escape"&&n.key!=="Esc"&&n.keyCode!==27)return;try{var gc=window._findRhythmGC();if(!gc||gc.isGameOver)return;if(gc.isPaused){if(gc.pausePopupInstance){var cs=gc.pausePopupInstance._components||gc.pausePopupInstance.components||[];for(var j=0;j<cs.length;j++){if(cs[j]&&typeof cs[j].onClickContinueBtn==="function"){cs[j].onClickContinueBtn();return;}}}gc.resumeGame();}else{gc.pauseGame();}}catch(e){console.warn("[ESC RhythmGame] error:",e&&e.message)}};

<script>
// 将 PC 键位提示注入「玩法说明」弹窗（faq_start_popup）滚动内容顶部
(function () {
  if (window.__rhythmKeyHintInstalled) return;
  window.__rhythmKeyHintInstalled = true;

  var HINT_TEXT = 'PC键位：D / F / J / K 键操作　　ESC 暂停 / 继续游戏';
  var HINT_H = 46, GAP = 10;

  function findNode(root, name, depth) {
    if (!root || depth < 0) return null;
    if (root.name === name) return root;
    var ch = root.children || [];
    for (var i = 0; i < ch.length; i++) {
      var r = findNode(ch[i], name, depth - 1);
      if (r) return r;
    }
    return null;
  }

  function comps(n) { return (n && (n._components || n.components)) || []; }

  function compWhere(n, pred) {
    var cs = comps(n);
    for (var i = 0; i < cs.length; i++) {
      if (cs[i] && pred(cs[i])) return cs[i];
    }
    return null;
  }

  function isUITransform(c) { return typeof c.setContentSize === 'function' && 'anchorX' in c; }
  function isScrollView(c) { return 'content' in c && typeof c.scrollToTop === 'function'; }
  function isGraphics(c) { return typeof c.roundRect === 'function' && typeof c.fill === 'function'; }

  function inject(popup) {
    var svNode = findNode(popup, 'ScrollView', 5);
    if (!svNode) return false;

    var sv = compWhere(svNode, isScrollView);
    if (!sv || !sv.content) return false;

    var img = sv.content;
    if (img.__keyHintDone) return true;

    var uiT = compWhere(img, isUITransform);
    if (!uiT) return false;
    var UITransformCtor = uiT.constructor;

    var view = img.parent || findNode(svNode, 'view', 3);
    if (!view) return false;
    var gComp = compWhere(view, isGraphics);
    var GraphicsCtor = gComp ? gComp.constructor : (cc.Graphics || null);

    if (typeof cc.Node !== 'function' || typeof cc.Label !== 'function' ||
        typeof GraphicsCtor !== 'function' || typeof UITransformCtor !== 'function') {
      return false;
    }

    // 新建节点默认 layer 为 DEFAULT，UI 相机不渲染，必须继承父节点 layer
    var UI_LAYER = view.layer;

    var W = uiT.width, H = uiT.height;
    var ax = uiT.anchorX, ay = uiT.anchorY;
    var S = HINT_H + GAP;
    var Hb = H + S;
    var stripCenter = (1 - ay) * Hb - S / 2;

    var box = new cc.Node('keyHintBox');
    box.layer = UI_LAYER;
    var boxUt = box.addComponent(UITransformCtor);
    boxUt.setAnchorPoint(ax, ay);
    boxUt.setContentSize(W, Hb);
    box.setPosition(img.position.x, img.position.y - (1 - ay) * S);

    img.parent.addChild(box);
    box.addChild(img);
    img.setPosition(0, -ay * S);

    sv.content = box;
    img.__keyHintDone = true;

    var g = box.addComponent(GraphicsCtor);
    var ColorCtor = (g.fillColor && g.fillColor.constructor) || null;
    g.roundRect(-ax * W + 14, stripCenter - HINT_H / 2, W - 28, HINT_H, 8);
    if (ColorCtor) g.fillColor = new ColorCtor(255, 224, 102, 90);
    g.fill();
    g.lineWidth = 2;
    if (ColorCtor) g.strokeColor = new ColorCtor(78, 72, 104, 40);
    g.stroke();

    var ln = new cc.Node('keyHintLabel');
    ln.layer = UI_LAYER;
    var lnUt = ln.addComponent(UITransformCtor);
    lnUt.setContentSize(W - 28, HINT_H);
    var lb = ln.addComponent(cc.Label);
    lb.string = HINT_TEXT;
    lb.fontSize = 24;
    lb.lineHeight = 28;
    lb.horizontalAlign = 1;
    lb.verticalAlign = 1;
    if (ColorCtor) lb.color = new ColorCtor(78, 72, 104, 255);
    ln.setPosition(-ax * W + W / 2, stripCenter);
    box.addChild(ln);

    if (sv.scrollToTop) sv.scrollToTop(0);
    console.log('[keyHint] injected into faq_start_popup');
    return true;
  }

  setInterval(function () {
    var C = window.cc;
    if (!C || !C.director) return;
    var scene = C.director.getScene();
    if (!scene) return;
    var popup = findNode(scene, 'faq_start_popup', 6);
    if (!popup || popup.__keyHintPatched) return;
    try {
      if (inject(popup)) popup.__keyHintPatched = true;
    } catch (e) {}
  }, 250);
})();
</script>
